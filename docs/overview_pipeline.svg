<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="Tahoma, 'Leelawadee UI', 'Noto Sans Thai', sans-serif"><title>Pipeline ระบบครูเทียบระบบใหม่</title><rect width="680" height="560" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="175" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">ระบบครู (จุดอ่อน)</text><text x="505" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">ระบบใหม่ (แก้ด้วย)</text><rect x="40" y="60" width="270" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="175.0" y="78.72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#712B13">ตัด chunk ตามหัวข้อ</text><text x="175.0" y="97.44" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">ยาวถึง 8,404 ตัวอักษร</text><rect x="370" y="60" width="270" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="505.0" y="78.72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">P1 หัวข้อ + ไม่เกิน 800</text><text x="505.0" y="97.44" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">overlap + breadcrumb</text><line x1="312" y1="86" x2="366" y2="86" stroke="#888780" stroke-width="1.3" marker-end="url(#a)"/><rect x="40" y="126" width="270" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="175.0" y="144.72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#712B13">LLM เขียน context</text><text x="175.0" y="163.44" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">เห็นแค่ chunk, ภาษาอังกฤษ</text><rect x="370" y="126" width="270" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="505.0" y="144.72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">P2 ให้เห็นสารบัญ + section</text><text x="505.0" y="163.44" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">ตอบไทย + คำพ้อง</text><line x1="312" y1="152" x2="366" y2="152" stroke="#888780" stroke-width="1.3" marker-end="url(#a)"/><rect x="40" y="192" width="270" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="175.0" y="210.72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#712B13">BM25 analyzer standard</text><text x="175.0" y="229.44" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">ทั้งประโยคไทยเป็นคำเดียว</text><rect x="370" y="192" width="270" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="505.0" y="210.72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">P3 analyzer thai</text><text x="505.0" y="229.44" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">BM25 Hit@5 0.07 → 0.89</text><line x1="312" y1="218" x2="366" y2="218" stroke="#888780" stroke-width="1.3" marker-end="url(#a)"/><rect x="40" y="258" width="270" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="175.0" y="276.72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#712B13">embed chunk + context</text><text x="175.0" y="295.44" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">chunk ใหญ่ vector เบลอ</text><rect x="370" y="258" width="270" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="505.0" y="276.72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">P4 breadcrumb+context+chunk</text><text x="505.0" y="295.44" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">dense Hit@1 0.68 → 0.79</text><line x1="312" y1="284" x2="366" y2="284" stroke="#888780" stroke-width="1.3" marker-end="url(#a)"/><rect x="40" y="324" width="270" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="175.0" y="342.72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#712B13">RRF ฝั่งละ 10</text><text x="175.0" y="361.44" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">rank เริ่ม 0 ผิดสูตร</text><rect x="370" y="324" width="270" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="505.0" y="342.72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">P5 RRF ฝั่งละ 20</text><text x="505.0" y="361.44" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">rank เริ่ม 1 ตามสูตร</text><line x1="312" y1="350" x2="366" y2="350" stroke="#888780" stroke-width="1.3" marker-end="url(#a)"/><rect x="40" y="390" width="270" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="175.0" y="408.72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#712B13">ไม่มี rerank</text><text x="175.0" y="427.44" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Hit@1 0.64, MRR 0.78</text><rect x="370" y="390" width="270" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="505.0" y="408.72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">P6 cross-encoder rerank</text><text x="505.0" y="427.44" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Hit@1 0.82, MRR 0.90</text><line x1="312" y1="416" x2="366" y2="416" stroke="#888780" stroke-width="1.3" marker-end="url(#a)"/><rect x="40" y="456" width="270" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="175.0" y="474.72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#712B13">ส่ง 5 chunk ให้ LLM</text><text x="175.0" y="493.44" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">~11,100 ตัว, prompt หลวม</text><rect x="370" y="456" width="270" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="505.0" y="474.72" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">P7 filter + prompt ใหม่</text><text x="505.0" y="493.44" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">~1,700 ตัว + อ้างอิง [n]</text><line x1="312" y1="482" x2="366" y2="482" stroke="#888780" stroke-width="1.3" marker-end="url(#a)"/><text x="340" y="532" text-anchor="middle" font-size="12" fill="#5F5E5A">LLM ตอบคำถาม: ตัวเดียวกันทั้งสองระบบ (ห้ามเปลี่ยนตามโจทย์)</text></svg>